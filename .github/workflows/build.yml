name: Build ProjetoH V13

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          python3 --version
          git --version

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Prepare clean V13 source
        run: |
          set -euo pipefail
          BASE='96953d9b1f6dbc9d55567d8a4b6e53c6c47dd502'
          git fetch --no-tags origin "$BASE"
          git checkout "$BASE" -- Sources/PHOverlayManager.m

      - name: Validate V13 source
        run: |
          set -euo pipefail
          test -f Sources/PHV13Patch.m
          grep -Fq 'css-display-none' Sources/PHV13Patch.m
          grep -Fq '"trigger"' Sources/PHV13Patch.m
          grep -Fq 'Salvar alterações?' Sources/PHV13Patch.m
          grep -Fq 'PHV13Pending' Sources/PHV13Patch.m
          grep -Fq 'NSJSONWritingPrettyPrinted' Sources/PHV13Patch.m
          grep -Fq 'custom-filters.json' Sources/PHV13Patch.m
          grep -Fq 'ProjetoH V13' Makefile .github/workflows/build.yml

      - name: Build package and dylib
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect and validate standalone V13 dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CANDIDATES=$(find .theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/ProjetoH.dylib' -print)
          if [ -z "$CANDIDATES" ]; then
            echo "No staged ProjetoH.dylib found."
            find .theos -type f | sort | tail -n 200
            exit 1
          fi
          DYLIB=""
          while IFS= read -r candidate; do
            description=$(file -b "$candidate")
            echo "$candidate -> $description"
            if echo "$description" | grep -q 'dynamically linked shared library'; then
              DYLIB="$candidate"
              break
            fi
          done <<< "$CANDIDATES"
          if [ -z "$DYLIB" ]; then
            echo "Found candidates, but none is a real Mach-O DYLIB."
            exit 1
          fi
          cp "$DYLIB" artifacts/ProjetoH-V13.dylib
          file artifacts/ProjetoH-V13.dylib
          file -b artifacts/ProjetoH-V13.dylib | grep -q 'dynamically linked shared library'
          ls -lah artifacts

      - name: Upload ProjetoH V13 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoH-V13-dylib
          path: artifacts/ProjetoH-V13.dylib
          if-no-files-found: error
