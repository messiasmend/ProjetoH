name: Build ProjetoH V15

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          python3 --version
          git --version

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Validate V15 source
        run: |
          set -u
          fail=0
          check() {
            label="$1"
            shift
            if "$@"; then
              echo "OK: $label"
            else
              echo "FAIL: $label"
              fail=1
            fi
          }

          check "Ocultar button" grep -q 'Ocultar' Sources/PHOverlayManager.m
          check "Ocultos button" grep -q 'Ocultos' Sources/PHOverlayManager.m
          check "Salvar button" grep -q 'Salvar' Sources/PHOverlayManager.m
          check "Pending selectors" grep -q 'PHPendingSelectors' Sources/PHOverlayManager.m
          check "Persistent filters" grep -q 'ProjetoH.PersistentFilters' Sources/PHOverlayManager.m
          check "Hierarchy action" grep -q 'showHierarchy' Sources/PHOverlayManager.m
          check "Restore action" grep -q 'restoreInspector' Sources/PHOverlayManager.m
          check "Custom filters metadata" grep -q 'custom-filters.json' Sources/PHOverlayManager.m
          check "V15 patch source" test -f Sources/PHV15Patch.m
          check "Lottie Player support" grep -q 'Lottie Player' Sources/PHV15Patch.m
          check "Reativar todos" grep -q 'Reativar todos' Sources/PHV15Patch.m

          echo "--- V15 validation summary ---"
          if [ "$fail" -ne 0 ]; then
            echo "One or more V15 checks failed. See the exact FAIL lines above."
            exit 1
          fi
          echo "All V15 source checks passed."

      - name: Build package and dylib
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect and validate standalone V15 dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CANDIDATES=$(find .theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/ProjetoH.dylib' -print)
          if [ -z "$CANDIDATES" ]; then
            echo "No staged ProjetoH.dylib found."
            find .theos -type f | sort | tail -n 200
            exit 1
          fi
          DYLIB=""
          while IFS= read -r candidate; do
            description=$(file -b "$candidate")
            echo "$candidate -> $description"
            if echo "$description" | grep -q 'dynamically linked shared library'; then
              DYLIB="$candidate"
              break
            fi
          done <<< "$CANDIDATES"
          if [ -z "$DYLIB" ]; then
            echo "Found candidates, but none is a real Mach-O DYLIB."
            exit 1
          fi
          cp "$DYLIB" artifacts/ProjetoH-V15.dylib
          file artifacts/ProjetoH-V15.dylib
          file -b artifacts/ProjetoH-V15.dylib | grep -q 'dynamically linked shared library'
          ls -lah artifacts

      - name: Upload ProjetoH V15 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoH-V15-dylib
          path: artifacts/ProjetoH-V15.dylib
          if-no-files-found: error
