name: Build ProjetoH V9.8

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          set -euo pipefail
          echo "RUNNER TEST OK"
          sw_vers
          uname -m
          xcodebuild -version
          python3 --version
          git --version
