name: Build ProjetoH V21

on:
  push:
    branches: [v21-build]
  pull_request:
    branches: [v21-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Prepare V21 source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('Sources/PHOverlayManager.m')
          s = p.read_text()

          # V21 must not contain the legacy periodic filter timer. Remove the
          # declaration and the constructor block by structure, not exact whitespace.
          s, n1 = re.subn(
              r'\nstatic\s+NSTimer\s*\*\s*PHApplyTimer\s*=\s*nil\s*;\s*',
              '\n', s, count=1
          )
          s, n2 = re.subn(
              r'\n__attribute__\s*\(\(constructor\)\)\s*static\s+void\s+PHInit\s*\(\s*void\s*\)\s*\{.*?\}\s*\Z',
              '\n', s, count=1, flags=re.S
          )

          # Safety net: if the constructor was formatted unexpectedly, remove
          # everything from its unique marker to EOF. The constructor is the
          # final block in this source file.
          if 'scheduledTimerWithTimeInterval' in s:
              marker = '__attribute__((constructor))'
              pos = s.find(marker)
              if pos >= 0:
                  s = s[:pos].rstrip() + '\n'

          p.write_text(s)
          print(f'removed timer declaration: {n1}, constructor: {n2}')
          print('scheduledTimerWithTimeInterval remains:', 'scheduledTimerWithTimeInterval' in s)
          PY

      - name: Validate V21 source
        run: |
          set -euo pipefail
          grep -q 'PHV15Patch.m' Makefile
          grep -q 'css-display-none' Sources/PHV15Patch.m
          grep -q 'url-filter' Sources/PHV15Patch.m
          if grep -R -q 'scheduledTimerWithTimeInterval' Sources/*.m; then
            echo 'Unexpected periodic timer remains in V21.'
            exit 1
          fi
          if grep -q 'WKUserScriptInjectionTimeAtDocumentStart' Makefile Sources/*.m; then
            echo 'Unexpected WebKit preload hook remains in V21.'
            exit 1
          fi
          echo 'V21 source validation passed.'

      - name: Build package and dylib
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect and validate V21 dylib
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DYLIB=$(find .theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/ProjetoH.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/ProjetoH-V21.dylib
          file artifacts/ProjetoH-V21.dylib
          file -b artifacts/ProjetoH-V21.dylib | grep -q 'dynamically linked shared library'
          ls -lah artifacts

      - name: Upload ProjetoH V21 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoH-V21-dylib
          path: artifacts/ProjetoH-V21.dylib
          if-no-files-found: error