name: Build ProjetoH

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Build ProjetoH dylib
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Collect dylib
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          DYLIB="$(find .theos -type f -name 'ProjetoH.dylib' | head -n 1)"
          if [ -z "$DYLIB" ]; then
            echo "ProjetoH.dylib not found"
            find .theos -type f | sort | tail -n 100
            exit 1
          fi
          cp "$DYLIB" "artifacts/ProjetoH.dylib"
          file "artifacts/ProjetoH.dylib"
          ls -lah artifacts

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoH-dylib
          path: artifacts/ProjetoH.dylib
          if-no-files-found: error
