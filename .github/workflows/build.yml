name: Build ProjetoH V17

on:
  push:
    branches: [main, v17-build]
  pull_request:
    branches: [main, v17-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          python3 --version
          git --version

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Validate V17 source
        run: |
          set -euo pipefail
          fail=0
          check() {
            label="$1"
            shift
            if "$@"; then
              echo "OK: $label"
            else
              echo "FAIL: $label"
              fail=1
            fi
          }

          check "Ocultar button" grep -q 'Ocultar' Sources/PHV17ButtonOrderFix.m
          check "Ocultos button" grep -q 'Ocultos' Sources/PHV17ButtonOrderFix.m
          check "Salvar button" grep -q 'Salvar' Sources/PHV17ButtonOrderFix.m
          check "Leading constraint" grep -q 'hidden.leadingAnchor' Sources/PHV17ButtonOrderFix.m
          check "Center constraint" grep -q 'hide.centerXAnchor' Sources/PHV17ButtonOrderFix.m
          check "Trailing constraint" grep -q 'save.trailingAnchor' Sources/PHV17ButtonOrderFix.m
          check "No V16 patch in Makefile" bash -c '! grep -q "PHV16ButtonOrderFix" Makefile'
          check "V17 patch in Makefile" grep -q 'PHV17ButtonOrderFix' Makefile
          check "V15 patch source" test -f Sources/PHV15Patch.m
          check "Lottie support implementation" grep -Rqi 'lottie-player' Sources
          check "Reativar todos" grep -q 'Reativar todos' Sources/PHV15Patch.m

          echo "--- V17 validation summary ---"
          if [ "$fail" -ne 0 ]; then
            echo "One or more V17 source checks failed."
            exit 1
          fi
          echo "All V17 source checks passed."

      - name: Build package and dylib
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect and validate standalone V17 dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CANDIDATES=$(find .theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/ProjetoH.dylib' -print)
          if [ -z "$CANDIDATES" ]; then
            echo "No staged ProjetoH.dylib found."
            find .theos -type f | sort | tail -n 200
            exit 1
          fi
          DYLIB=""
          while IFS= read -r candidate; do
            description=$(file -b "$candidate")
            echo "$candidate -> $description"
            if echo "$description" | grep -q 'dynamically linked shared library'; then
              DYLIB="$candidate"
              break
            fi
          done <<< "$CANDIDATES"
          if [ -z "$DYLIB" ]; then
            echo "Found candidates, but none is a real Mach-O DYLIB."
            exit 1
          fi
          cp "$DYLIB" artifacts/ProjetoH-V17.dylib
          file artifacts/ProjetoH-V17.dylib
          file -b artifacts/ProjetoH-V17.dylib | grep -q 'dynamically linked shared library'
          ls -lah artifacts

      - name: Upload ProjetoH V17 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoH-V17-dylib
          path: artifacts/ProjetoH-V17.dylib
          if-no-files-found: error
