name: Build ProjetoH V9.8

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # GitHub Actions build trigger: use the proven macOS-14 runner.
    # Keep the known-good runner while fixing the GUI/persistence code.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          python3 --version
          git --version

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Apply V9.8 save/gui/persistence patch
        run: |
          set -euo pipefail
          python3 Scripts/apply_v9_8_save_gui_persistence.py

      - name: Validate V9.8 source
        run: |
          set -euo pipefail
          grep -q 'Ocultar' Sources/PHOverlayManager.m
          grep -q 'Ocultos' Sources/PHOverlayManager.m
          grep -q 'Salvar' Sources/PHOverlayManager.m
          grep -q 'PHPendingSelectors' Sources/PHOverlayManager.m
          grep -q 'ProjetoH.PersistentFilters' Sources/PHOverlayManager.m
          grep -q 'showHierarchy' Sources/PHOverlayManager.m
          grep -q 'restoreInspector' Sources/PHOverlayManager.m
          grep -q 'custom-filters.json' Sources/PHOverlayManager.m
          grep -q 'heightAnchor constraintEqualToConstant:560' Sources/PHOverlayManager.m
          ! grep -q 'PHCustomFiltersManager.m' Makefile

      - name: Build package and dylib
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect and validate standalone V9.8 dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CANDIDATES=$(find .theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/ProjetoH.dylib' -print)
          if [ -z "$CANDIDATES" ]; then
            echo "No staged ProjetoH.dylib found."
            find .theos -type f | sort | tail -n 200
            exit 1
          fi
          DYLIB=""
          while IFS= read -r candidate; do
            description=$(file -b "$candidate")
            echo "$candidate -> $description"
            if echo "$description" | grep -q 'dynamically linked shared library'; then
              DYLIB="$candidate"
              break
            fi
          done <<< "$CANDIDATES"
          if [ -z "$DYLIB" ]; then
            echo "Found candidates, but none is a real Mach-O DYLIB."
            exit 1
          fi
          cp "$DYLIB" artifacts/ProjetoH-V9.8.dylib
          file artifacts/ProjetoH-V9.8.dylib
          file -b artifacts/ProjetoH-V9.8.dylib | grep -q 'dynamically linked shared library'
          ls -lah artifacts

      - name: Upload ProjetoH V9.8 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoH-V9.8-dylib
          path: artifacts/ProjetoH-V9.8.dylib
          if-no-files-found: error
