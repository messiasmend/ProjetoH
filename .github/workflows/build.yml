name: Build ProjetoH V14

on:
  push:
    branches: [main, v14-submit]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          python3 --version
          git --version

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Validate V14 source
        run: |
          set -euo pipefail
          grep -q 'Ocultar' Sources/PHOverlayManager.m
          grep -q 'Ocultos' Sources/PHOverlayManager.m
          grep -q 'Salvar' Sources/PHOverlayManager.m
          grep -q 'custom-filters.json' Sources/PHOverlayManager.m
          grep -q 'PHV14MetadataBridge' Sources/PHV14MetadataBridge.m
          grep -q 'projetoh-metadata.json' Sources/PHV14MetadataBridge.m
          grep -q 'PHV14MetadataBridge.m' Makefile
          ! grep -R -q 'apply_v9_8_save_gui_persistence.py' .
          ! grep -q 'PHCustomFiltersManager.m' Makefile

      - name: Build package and dylib
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect and validate standalone V14 dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CANDIDATES=$(find .theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/ProjetoH.dylib' -print)
          if [ -z "$CANDIDATES" ]; then
            echo "No staged ProjetoH.dylib found."
            find .theos -type f | sort | tail -n 200
            exit 1
          fi
          DYLIB=""
          while IFS= read -r candidate; do
            description=$(file -b "$candidate")
            echo "$candidate -> $description"
            if echo "$description" | grep -q 'dynamically linked shared library'; then
              DYLIB="$candidate"
              break
            fi
          done <<< "$CANDIDATES"
          if [ -z "$DYLIB" ]; then
            echo "Found candidates, but none is a real Mach-O DYLIB."
            exit 1
          fi
          cp "$DYLIB" artifacts/ProjetoH-V14.dylib
          file artifacts/ProjetoH-V14.dylib
          file -b artifacts/ProjetoH-V14.dylib | grep -q 'dynamically linked shared library'
          ls -lah artifacts

      - name: Upload ProjetoH V14 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoH-V14-dylib
          path: artifacts/ProjetoH-V14.dylib
          if-no-files-found: error
