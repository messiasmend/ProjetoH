name: Build ProjetoH V20

on:
  push:
    branches: [v20-build]
  pull_request:
    branches: [v20-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Validate V20 source
        run: |
          set -euo pipefail
          test -f Sources/PHV17ButtonOrderFix.m
          test -f Sources/PHV19PreloadFilter.m
          grep -q 'Sources/PHV17ButtonOrderFix.m' Makefile
          grep -q 'Sources/PHV19PreloadFilter.m' Makefile
          grep -q 'WKUserScriptInjectionTimeAtDocumentStart' Sources/PHV19PreloadFilter.m
          grep -q 'MutationObserver' Sources/PHV19PreloadFilter.m
          echo 'V20 source validation passed.'

      - name: Build package and dylib
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect and validate V20 dylib
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DYLIB=$(find .theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/ProjetoH.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/ProjetoH-V20.dylib
          file artifacts/ProjetoH-V20.dylib
          file -b artifacts/ProjetoH-V20.dylib | grep -q 'dynamically linked shared library'
          ls -lah artifacts

      - name: Upload ProjetoH V20 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoH-V20-dylib
          path: artifacts/ProjetoH-V20.dylib
          if-no-files-found: error
