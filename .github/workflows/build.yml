name: Build ProjetoH V12

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          python3 --version
          git --version

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Apply V12 GUI layout patch
        run: |
          set -euo pipefail
          python3 Scripts/apply_v12_gui.py

      - name: Finalize V12 custom-filters persistence
        run: |
          set -euo pipefail
          python3 Scripts/finalize_v12.py

      - name: Validate ProjetoH V12 source
        run: |
          set -euo pipefail
          grep -Fq 'Ocultar' Sources/PHOverlayManager.m
          grep -Fq 'Ocultos' Sources/PHOverlayManager.m
          grep -Fq 'Salvar' Sources/PHOverlayManager.m
          grep -Fq 'PHPendingSelectors' Sources/PHOverlayManager.m
          grep -Fq 'ProjetoH.SavedSelectors' Sources/PHOverlayManager.m
          grep -Fq 'custom-filters.json' Sources/PHOverlayManager.m
          grep -Fq 'css-display-none' Sources/PHOverlayManager.m
          ! grep -Fq 'PHWriteFilters(@[])' Sources/PHOverlayManager.m
          test ! -e Scripts/apply_v9_8_save_gui_persistence.py
          test ! -e V9.8-BUILD-TRIGGER.txt

      - name: Build package and dylib
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect and validate standalone V12 dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CANDIDATES=$(find .theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/ProjetoH.dylib' -print)
          if [ -z "$CANDIDATES" ]; then
            echo "No staged ProjetoH.dylib found."
            find .theos -type f | sort | tail -n 200
            exit 1
          fi
          DYLIB=""
          while IFS= read -r candidate; do
            description=$(file -b "$candidate")
            echo "$candidate -> $description"
            if echo "$description" | grep -q 'dynamically linked shared library'; then
              DYLIB="$candidate"
              break
            fi
          done <<< "$CANDIDATES"
          if [ -z "$DYLIB" ]; then
            echo "Found candidates, but none is a real Mach-O DYLIB."
            exit 1
          fi
          cp "$DYLIB" artifacts/ProjetoH-V12.dylib
          file artifacts/ProjetoH-V12.dylib
          file -b artifacts/ProjetoH-V12.dylib | grep -q 'dynamically linked shared library'
          ls -lah artifacts

      - name: Upload ProjetoH V12 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoH-V12-dylib
          path: artifacts/ProjetoH-V12.dylib
          if-no-files-found: error
