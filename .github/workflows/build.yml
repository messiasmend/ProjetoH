name: Build ProjetoH V12

on:
  push:
    branches: [v12-gui-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          python3 --version
          git --version

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Validate V12 source
        run: |
          set -euo pipefail
          test -f Sources/PHCustomFiltersManager.m
          test -f Sources/PHV12CustomFilters.m
          test -f Sources/PHV12GUIFix.m
          grep -q 'custom-filters.json' Sources/PHCustomFiltersManager.m
          grep -q 'PHNativeHideRule' Sources/PHCustomFiltersManager.m
          grep -q 'PHV12Pending' Sources/PHV12CustomFilters.m
          grep -q 'Salvar alterações?' Sources/PHV12CustomFilters.m
          grep -q 'css-display-none' Sources/PHV12CustomFilters.m
          grep -q 'Ocultar' Sources/PHV12CustomFilters.m
          grep -q 'Ocultos' Sources/PHV12CustomFilters.m
          grep -q 'Salvar' Sources/PHV12CustomFilters.m
          grep -q 'PHV12RestorePending' Sources/PHV12CustomFilters.m
          grep -q 'PHV12GUIRebuildButtons' Sources/PHV12GUIFix.m
          grep -q 'UIStackView' Sources/PHV12GUIFix.m

      - name: Build package and dylib
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect and validate standalone V12 dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CANDIDATES=$(find .theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/ProjetoH.dylib' -print)
          if [ -z "$CANDIDATES" ]; then
            echo "No staged ProjetoH.dylib found."
            find .theos -type f | sort | tail -n 200
            exit 1
          fi
          DYLIB=""
          while IFS= read -r candidate; do
            description=$(file -b "$candidate")
            echo "$candidate -> $description"
            if echo "$description" | grep -q 'dynamically linked shared library'; then
              DYLIB="$candidate"
              break
            fi
          done <<< "$CANDIDATES"
          if [ -z "$DYLIB" ]; then
            echo "Found candidates, but none is a real Mach-O DYLIB."
            exit 1
          fi
          cp "$DYLIB" artifacts/ProjetoH-V12.dylib
          file artifacts/ProjetoH-V12.dylib
          file -b artifacts/ProjetoH-V12.dylib | grep -q 'dynamically linked shared library'
          ls -lah artifacts

      - name: Upload ProjetoH V12 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoH-V12-dylib
          path: artifacts/ProjetoH-V12.dylib
          if-no-files-found: error
