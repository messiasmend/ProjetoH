name: Build ProjetoH V21

on:
  push:
    branches: [v21]
  pull_request:
    branches: [v21]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Validate V21 source
        run: |
          set -euo pipefail
          test -f Sources/PHV15Patch.m
          grep -q 'hideSelectedElement' Sources/PHV15Patch.m
          grep -q 'savePendingFilters' Sources/PHV15Patch.m
          grep -q 'custom-filters.json' Sources/PHV15Patch.m
          grep -q 'url-filter' Sources/PHV15Patch.m
          if grep -R -nE 'scheduledTimerWithTimeInterval|dispatch_after\([^;]*NSEC_PER_SEC' Sources/*.m; then
            echo 'Periodic/delayed timer logic is forbidden in V21.'
            exit 1
          fi
          if grep -R -n 'WKUserScriptInjectionTimeAtDocumentStart' Makefile Sources/*.m; then
            echo 'Unexpected WebKit preload hook remains in V21.'
            exit 1
          fi
          echo 'V21 source validation passed.'

      - name: Build package and dylib
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect and validate V21 dylib
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DYLIB=$(find .theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/ProjetoH.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/ProjetoH-V21.dylib
          file artifacts/ProjetoH-V21.dylib
          file -b artifacts/ProjetoH-V21.dylib | grep -q 'dynamically linked shared library'
          ls -lah artifacts

      - name: Upload ProjetoH V21 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoH-V21-dylib
          path: artifacts/ProjetoH-V21.dylib
          if-no-files-found: error
