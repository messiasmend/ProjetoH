name: ProjetoH V9 Fix

on:
  push:
    branches: [main]
    paths:
      - 'Sources/PHOverlayManager.m'
      - '.github/workflows/v9-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'ProjetoH V9: apply copy fix') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch PHOverlayManager
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('Sources/PHOverlayManager.m')
          s = p.read_text()

          old = '@property (nonatomic, strong, nullable) UIView *highlightView;\n+ (NSString *)descriptionForView:(UIView *)view;'
          new = '@property (nonatomic, strong, nullable) UIView *highlightView;\n@property (nonatomic, copy) NSString *currentDetails;\n+ (NSString *)descriptionForView:(UIView *)view;'
          if old not in s:
              raise SystemExit('PHInspectorViewController property anchor not found')
          s = s.replace(old, new, 1)

          old = '        self.selectionMode = NO;\n        [self clearSubviews];\n        UIView *panel = [self makePanel];'
          new = '        self.selectionMode = NO;\n        self.currentDetails = details ?: @"";\n        [self clearSubviews];\n        UIView *panel = [self makePanel];'
          if old not in s:
              raise SystemExit('showPanel anchor not found')
          s = s.replace(old, new, 1)

          old = '        UIButton *close = [self makeCloseButton];\n        UIButton *hierarchy = [UIButton buttonWithType:UIButtonTypeSystem];'
          new = '        UIButton *copyButton = [UIButton buttonWithType:UIButtonTypeSystem];\n        copyButton.translatesAutoresizingMaskIntoConstraints = NO;\n        [copyButton setTitle:@"Copiar" forState:UIControlStateNormal];\n        copyButton.titleLabel.font = [UIFont systemFontOfSize:15.0 weight:UIFontWeightSemibold];\n        [copyButton addTarget:self action:@selector(copyTapped) forControlEvents:UIControlEventTouchUpInside];\n        UIButton *close = [self makeCloseButton];\n        UIButton *hierarchy = [UIButton buttonWithType:UIButtonTypeSystem];'
          if old not in s:
              raise SystemExit('button anchor not found')
          s = s.replace(old, new, 1)

          old = '        [panel addSubview:detailsLabel];\n        [panel addSubview:hierarchy];\n        [panel addSubview:close];'
          new = '        [panel addSubview:detailsLabel];\n        [panel addSubview:hierarchy];\n        [panel addSubview:copyButton];\n        [panel addSubview:close];'
          if old not in s:
              raise SystemExit('subview anchor not found')
          s = s.replace(old, new, 1)

          old = '            [hierarchy.leadingAnchor constraintEqualToAnchor:panel.leadingAnchor constant:22.0],\n            [hierarchy.bottomAnchor constraintEqualToAnchor:panel.bottomAnchor constant:-20.0],\n            [close.trailingAnchor constraintEqualToAnchor:panel.trailingAnchor constant:-22.0],'
          new = '            [hierarchy.leadingAnchor constraintEqualToAnchor:panel.leadingAnchor constant:22.0],\n            [hierarchy.bottomAnchor constraintEqualToAnchor:panel.bottomAnchor constant:-20.0],\n            [copyButton.centerXAnchor constraintEqualToAnchor:panel.centerXAnchor],\n            [copyButton.bottomAnchor constraintEqualToAnchor:panel.bottomAnchor constant:-20.0],\n            [close.trailingAnchor constraintEqualToAnchor:panel.trailingAnchor constant:-22.0],'
          if old not in s:
              raise SystemExit('constraint anchor not found')
          s = s.replace(old, new, 1)

          old = '- (void)closeTapped { [[PHOverlayManager sharedManager] dismissOverlay]; }'
          new = '- (void)copyTapped {\n    UIPasteboard.generalPasteboard.string = self.currentDetails ?: @"";\n}\n\n- (void)closeTapped { [[PHOverlayManager sharedManager] dismissOverlay]; }'
          if old not in s:
              raise SystemExit('close method anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/PHOverlayManager.m
          git commit -m 'ProjetoH V9: apply copy fix' || exit 0
          git push

# trigger