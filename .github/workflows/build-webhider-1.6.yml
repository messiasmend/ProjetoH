name: Build WebHider 1.6

on:
  push:
    branches:
      - webhider-1.6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
      - name: Build package
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1
      - name: Collect dylib
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DYLIB=$(find .theos -type f -name '*.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/WebHider-1.6.dylib
          file artifacts/WebHider-1.6.dylib
      - name: Upload WebHider 1.6
        uses: actions/upload-artifact@v4
        with:
          name: WebHider-1.6
          path: artifacts/WebHider-1.6.dylib
          if-no-files-found: error
