name: Build WebHider 1.0

on:
  push:
    branches: [webhider-1.0]
  pull_request:
    branches: [webhider-1.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Validate WebHider 1.0 source
        run: |
          set -euo pipefail
          test -f Sources/PHV21FilterFormatFix.m
          test -f Sources/PHV21HiddenNamesFix.m
          echo 'WebHider 1.0 source validation passed.'

      - name: Apply WebHider branding
        run: |
          set -euo pipefail
          sed -i '' 's/ProjetoH Inspector/WebHider Inspector/g' Sources/PHOverlayManager.m

      - name: Build package and dylib
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect and validate WebHider dylib
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DYLIB=$(find .theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/WebHider.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/WebHider-1.0.dylib
          file artifacts/WebHider-1.0.dylib
          file -b artifacts/WebHider-1.0.dylib | grep -q 'dynamically linked shared library'
          ls -lah artifacts

      - name: Upload WebHider 1.0 dylib
        uses: actions/upload-artifact@v4
        with:
          name: WebHider-1.0-dylib
          path: artifacts/WebHider-1.0.dylib
          if-no-files-found: error
